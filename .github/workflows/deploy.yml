name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pages for this repo serves the gh-pages branch, so the deploy step pushes the
# built output there rather than using actions/deploy-pages.
permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DIST: dist/ahmed-mobasher-portfolio

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Angular 13 targets Node 16; newer majors break this build pipeline.
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests
        run: npm run test:ci

      - name: Build (production)
        run: npm run build-portfolio

      - name: Verify pre-rendered routes
        run: |
          set -e
          for route in \
            index.html \
            en/index.html \
            ar/index.html \
            en/projects/index.html \
            ar/projects/index.html \
            404.html \
            .nojekyll \
            robots.txt \
            sitemap.xml \
            assets/cv/Ahmed-Mobasher-CV.pdf
          do
            test -f "$DIST/$route" || { echo "::error::missing $route"; exit 1; }
            echo "ok  $route"
          done

      - name: Upload build output
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ env.DIST }}
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Publish to gh-pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Push to gh-pages
        run: |
          set -e
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cd site
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
