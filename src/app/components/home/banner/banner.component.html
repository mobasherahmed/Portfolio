<section class="section banner">
    <div [@bannerTrigger] class="container">
        <div class="section-box-banner">
            <div class="content">
                <p class="banner-pretitle">{{"Banner.Pretitle" | translate}}</p>
                <div class='banner-title'>
                    <h1>{{"Banner.Name" | translate}}</h1>
                    <h2>{{"Banner.Role" | translate}}</h2>
                </div>
                <div class='banner-description'>
                    <p [innerHTML]='"Banner.Description" | translate' class="mt-4"></p>
                    <p class="banner-availability">
                        <span class="banner-availability__dot" aria-hidden="true"></span>
                        {{"Banner.Availability" | translate}}
                    </p>
                </div>
            </div>
            <div class="div-btn-banner">
                <a (click)='analyticsService.sendAnalyticEvent("click_download_cv", "banner", "cv")'
                   [href]="cvPath" [attr.download]="cvFileName" class="main-btn">
                    {{"Banner.ActionBtn" | translate}}
                </a>
            </div>
        </div>
    </div>
</section>
