<section class="section proyects" id='proyects'>
    <div class="container">
        <div class="section-box">
            <div data-aos="fade-up" data-aos-duration="1000">
                <h3 class="section-title">
                    <span class='n-section-title'>03.</span> {{"FeatureProjects.Title" | translate}}
                </h3>
            </div>

            <article *ngFor='let project of "FeatureProjects.Projects" | translate; let i = index'
                     class="case-study"
                     [class.case-study--reversed]="i % 2 !== 0"
                     [class.case-study--textonly]="!project.imgs?.length"
                     data-aos="fade-up" data-aos-duration="800">

                <div class="case-study__media" *ngIf="project.imgs?.length">
                    <owl-carousel-o class='owl-carousel-o' [options]="customOptions">
                        <ng-container *ngFor="let img of project.imgs; let imgIndex = index">
                            <ng-template carouselSlide [id]="project.Title + '-' + imgIndex">
                                <div class='img-container'>
                                    <img class='img-feature-proyect rounded'
                                         [src]="img"
                                         [attr.alt]="project.Title + ' — screenshot ' + (imgIndex + 1)"
                                         loading="lazy" decoding="async">
                                </div>
                            </ng-template>
                        </ng-container>
                    </owl-carousel-o>
                </div>

                <div class="case-study__body">
                    <p class="case-study__label">{{"FeatureProjects.Label" | translate}}</p>
                    <h4 class="case-study__title">{{project.Title}}</h4>
                    <p class="case-study__context" *ngIf="project.Context">{{project.Context}}</p>

                    <div class="case-study__panel">
                        <p class="case-study__description" [innerHTML]="project.Description"></p>

                        <div class="case-study__challenge" *ngIf="project.Challenge">
                            <h5 class="case-study__challenge-label">{{"FeatureProjects.ChallengeLabel" | translate}}</h5>
                            <p [innerHTML]="project.Challenge"></p>
                        </div>
                    </div>

                    <ul class="case-study__tech">
                        <li *ngFor='let technology of project.Technologies'>
                            <span class="technology">{{technology}}</span>
                        </li>
                    </ul>

                    <div class="case-study__links" *ngIf="project.ghLink || project.demoLink">
                        <a *ngIf="project.ghLink" [href]="project.ghLink" target="_blank" rel="noopener noreferrer"
                           [attr.aria-label]="project.Title + ' — source code on GitHub'">
                            <i class="fab fa-github" aria-hidden="true"></i>
                        </a>
                        <a *ngIf="project.demoLink" [href]="project.demoLink" target="_blank" rel="noopener noreferrer"
                           [attr.aria-label]="project.Title + ' — live site'">
                            <i class="fas fa-external-link-alt" aria-hidden="true"></i>
                        </a>
                    </div>
                </div>
            </article>
        </div>
    </div>
</section>
